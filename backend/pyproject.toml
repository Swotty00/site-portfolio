[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-api"
version = "1.0.0"
description = "FastAPI backend for the portfolio: projects, profile, auth and PDF résumé."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36",
  "bcrypt>=4.2",
  "PyJWT>=2.9",
  "python-multipart>=0.0.12",
  "jinja2>=3.1.4",
  "weasyprint>=63",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "PL"]
ignore = [
  "B008",     # FastAPI's Depends() in argument defaults is idiomatic
  "PLR0913",  # endpoints legitimately take many dependencies
  "PLR2004",  # magic values in comparisons
  "S101",     # asserts are fine (tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "PLR0915"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
