# Serves the built SPA and reverse-proxies the API. Runs as an unprivileged user on :8080.

# Defence in depth: the API enforces its own limits; these protect it from floods.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;   # image uploads (the API enforces its own 5 MB limit)

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The client IP is *overwritten* (not appended) with the address nginx saw, so a visitor can't
    # spoof X-Forwarded-For to dodge the API's per-IP rate limits. Behind another load balancer,
    # restore the real client IP first with ngx_http_realip_module (set_real_ip_from ...).
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Vite emits content-hashed filenames under /assets: cache them forever.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Demo artwork shipped in /public/projects. Matched by extension because /projects/<slug> is a
    # client-side route and must keep falling through to the SPA shell.
    location ~* ^/projects/.+\.(svg|png|jpe?g|webp|avif)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Static documents at the site root, e.g. the résumé at /curriculo.pdf (put the file in
    # frontend/public). Served without a CSP on purpose: restrictive CSP directives such as `sandbox`
    # are known to stop Chrome's built-in PDF viewer from rendering a PDF. It is a static file from
    # your own repository, never user input. Root-level only, so /api/*.pdf is never shadowed.
    location ~* ^/[^/]+\.pdf$ {
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Everything else is a client-side route: serve the SPA shell (never cached).
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
