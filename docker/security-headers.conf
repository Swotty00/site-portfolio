# Included by every location that sets its own headers (nginx drops inherited add_header
# directives as soon as a location defines one).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Scripts only from our own origin. Inline *styles* are allowed because React/GSAP set style
# attributes at runtime; images may come from https URLs entered in the admin dashboard.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Enable HSTS at your TLS-terminating proxy / load balancer (not here: this hop is plain HTTP):
#   Strict-Transport-Security: max-age=63072000; includeSubDomains
