name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ backend: lint, types, tests
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: System libraries for WeasyPrint (PDF tests) and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fontconfig fonts-noto-core fonts-noto-cjk
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ------------------------------------------------------------ frontend: lint, types, tests, build
  frontend:
    name: Frontend (eslint · tsc · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ----------------------------------------------------------- dependency vulnerability scan (advisory)
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true # advisory: surfaces new CVEs without blocking unrelated PRs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          python -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt
      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # ------------------------------------------- build the images and smoke-test the whole stack
  smoke:
    name: Docker build + smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Write .env for the stack
        run: |
          {
            echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
            echo "ADMIN_PASSWORD=ci-admin-password-123"
            echo "COOKIE_SECURE=false"
          } > .env
      - name: Start the stack (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke tests through nginx
        run: |
          set -euo pipefail
          B=http://localhost:8080
          curl --fail --silent "$B/healthz"
          curl --fail --silent "$B/api/v1/health"
          curl --fail --silent "$B/api/v1/projects?lang=en" | grep -q '"slug":"aurora"'
          curl --fail --silent "$B/projects/aurora" | grep -q '<div id="root">'   # SPA fallback
          # The résumé PDF is generated inside the image: this proves Pango + fonts are installed.
          for lang in en ja zh ru; do
            curl --fail --silent -o "resume-$lang.pdf" "$B/api/v1/resume.pdf?lang=$lang"
            head -c 5 "resume-$lang.pdf" | grep -q '%PDF-'
          done
          # Admin API must reject anonymous callers.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/api/v1/admin/projects")" = 401
      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ----------------------------------------------------------------- publish images (main + tags)
  publish:
    name: Publish images to GHCR
    needs: [smoke]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: backend, context: ./backend, file: ./backend/Dockerfile }
          - { name: frontend, context: ., file: ./frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ------------------------------------------------------------------------ deploy (opt-in)
  # Enable by setting the repository variable DEPLOY_ENABLED=true and adding the secrets
  # DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY. The server needs docker compose and a .env file
  # next to docker-compose.yml. Uses a GitHub "production" environment so you can require approval.
  deploy:
    name: Deploy
    needs: [publish]
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ~/portfolio
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/portfolio
            export BACKEND_IMAGE=${{ env.IMAGE_PREFIX }}-backend:main
            export FRONTEND_IMAGE=${{ env.IMAGE_PREFIX }}-frontend:main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
